name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: releaseguard
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: releaseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releaseguard -d releaseguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://releaseguard:test_password@localhost/releaseguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: docker build -t releaseguard .
