[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard"
version = "1.0.0"
description = "A small Python API regression monitor with evaluated anomaly detection"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "scikit-learn>=1.6,<2", "numpy>=2,<3", "pandas>=2.2,<4",
  "streamlit>=1.40,<2", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["releaseguard*", "demo_app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: tests requiring TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
