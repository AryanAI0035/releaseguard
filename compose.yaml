services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releaseguard
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard_dev
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard -d releaseguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://releaseguard:releaseguard_dev@db/releaseguard
    depends_on:
      db:
        condition: service_healthy

  demo:
    build: .
    command: python -m uvicorn demo_app.main:app --host 0.0.0.0 --port 8001 --no-access-log
    ports:
      - "127.0.0.1:8001:8001"

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: &environment
      DATABASE_URL: postgresql+psycopg://releaseguard:releaseguard_dev@db/releaseguard
      DEMO_ORIGIN: http://demo:8001
      ARTIFACT_DIR: /app/artifacts
    volumes: &files
      - ./artifacts:/app/artifacts
      - ./results:/app/results
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: python -m releaseguard.worker
    environment: *environment
    volumes: *files
    depends_on:
      api:
        condition: service_healthy
      demo:
        condition: service_started

  dashboard:
    build: .
    command: python -m streamlit run dashboard.py --server.address 0.0.0.0 --browser.gatherUsageStats false
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_ORIGIN: http://api:8000
      EVALUATION_PATH: /app/results/evaluation.json
    volumes: *files
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
